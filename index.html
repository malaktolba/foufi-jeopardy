const sub=t=>t.replace(/\{B\}/g,B);
/* sound */
function beep(f,d=.15,t="sine",v=.12){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.2,"triangle"),i*110))}
$("#mute").onclick=()=>{muted=!muted;$("#mute").textContent=muted?"🔇":"🔊"};
/* floating hearts */
(()=>{const e=["💖","✨","🥂","💍","🌸","🍾","💕"];for(let i=0;i<22;i++){const s=document.createElement("span");s.textContent=e[i%e.length];s.style.left=Math.random()*100+"%";s.style.fontSize=14+Math.random()*22+"px";s.style.animationDuration=9+Math.random()*12+"s";s.style.animationDelay=-Math.random()*15+"s";$("#fx").appendChild(s)}})();
/* confetti */
const cv=document.createElement("canvas");cv.id="cv";document.body.appendChild(cv);const cx=cv.getContext("2d");let P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function confetti(n=140){const col=["#ffd166","#ff4fa3","#9b2fd1","#fff","#6ee7ff"];for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*18-4,s:5+Math.random()*7,c:col[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:140});if(!run){run=true;tick()}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});if(P.length)requestAnimationFrame(tick);else run=false}
let PH=[];function pols(){PH.forEach((p,i)=>{const d=document.createElement('div');d.className='pol';d.style.left=(4+(i*29)%88)+'%';d.style.animationDuration=18+Math.random()*14+'s';d.style.animationDelay=-Math.random()*20+'s';d.innerHTML='<img src="'+p.src+'">';$('#fx').appendChild(d)})}addEventListener('pointermove',e=>{if(Math.random()>.3)return;const s=document.createElement('span');s.className='spark';s.textContent=['✨','💖','⭐'][Math.floor(Math.random()*3)];s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.fontSize=10+Math.random()*12+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),800)});/* start */
$("#go").onclick=()=>{B="Foufi";teams=[...document.querySelectorAll(".tn")].map(i=>i.value.trim()).filter(Boolean).map(n=>({n,s:0}));if(!teams.length)teams=[{n:"Team 1",s:0}];
 const ks=[];for(let c=0;c<CATS.length;c++)if(!CATS[c].dare)for(let r=1;r<5;r++)ks.push(c+'-'+r);ks.sort(()=>Math.random()-.5);ddKey=ks[0];STL=new Set([ks[1],ks[2]]);
 $("#title").textContent="FOUFI-JEOPARDY";$("#sub").textContent="Bachelorette edition 💍";
 if(PH.length){const q=PH.slice(0,5).map(p=>[p.q||'Name this moment!',p.a||'Ask the bride 😉',p.src]);while(q.length<5)q.push(['Everybody raise a glass to {B}!','DARE: cheers! 🥂']);CATS.push({n:'Picture This 📸',c:q});pols()}document.body.classList.add('playing');$("#setup").classList.add("hide");$("#game").classList.remove("hide");draw();jingle([523,659,784,1047]);confetti(80)};
function draw(){const b=$("#board");b.innerHTML="";b.style.gridTemplateColumns='repeat('+CATS.length+',minmax(0,1fr))';b.style.setProperty('--fimg','url('+FOUFI+')');b.style.setProperty('--cimg','url('+COUPLE+')');b.style.setProperty('--bimg','url('+BRAIN+')');b.style.setProperty('--eimg','url('+EMO+')');b.style.setProperty('--simg','url('+FLAGIMG+')');b.style.marginTop='125px';
 CATS.forEach((c,i)=>{const d=document.createElement("div");d.className="cat";d.textContent=sub(c.n);if(DEC[i]){d.classList.add("foufi");const im=new Image();im.src=DEC[i];im.className="cut";d.appendChild(im)}d.style.animationDelay=i*.1+"s";b.appendChild(d)});
 for(let r=0;r<5;r++)CATS.forEach((c,i)=>{const t=document.createElement("button");t.className="tile"+(DEC[i]?" f"+i:"");t.textContent="$"+VALS[r];t.style.animationDelay=.5+(r*5+i)*.04+"s";t.onclick=()=>open(i,r,t);b.appendChild(t)});
 score()}
function score(bump=-1){const s=$("#scores");s.innerHTML="";teams.forEach((t,i)=>{const d=document.createElement("div");d.className="team"+(t.s<0?" neg":"")+(i===bump?" bump":"");d.innerHTML="<b></b><div class='pts'></div>";d.firstChild.textContent=t.n;d.lastChild.textContent="$"+t.s.toLocaleString();s.appendChild(d)})}
const DARES=[['🥂','Take a sip!'],['💃','Do your best runway walk!'],['🎤','Sing the chorus of a love song!'],['🔄','Swap seats with the bride!'],['💬','Compliment everyone in 10 seconds!'],['🕺','Dance with no music for 15 seconds!'],['📞','Call someone and say I love you!'],['🤳','Group selfie with the bride!']];
function img(k){return k==='F'?FOUFI:k==='C'?COUPLE:k}
function splash(h,notes,cb){const d=document.createElement('div');d.id='dd';d.innerHTML='<span>'+h+'</span>';document.body.appendChild(d);jingle(notes);confetti(80);setTimeout(()=>{d.remove();cb()},1800)}
function open(ci,r,tile){const key=ci+'-'+r,val=VALS[r];beep(330,.1,'square',.06);
 if(CATS[ci].dare)return wheelUI({tile,val});
 if(ddKey===key)splash('⭐ DAILY DOUBLE ⭐<br>Place your bet!',[392,523,659,784,988],()=>wager(val,(v,t)=>show(ci,r,tile,v,t,false)));
 else if(STL.has(key))splash('🥷 STEAL TILE 🥷<br>Win it and rob the leader!',[300,250,200,330],()=>show(ci,r,tile,val,null,true));
 else show(ci,r,tile,val,null,false)}
function wager(base,go){const w=document.createElement('div');w.id='wg';w.innerHTML='<div id="wc"><h3>💰 Daily Double!</h3><p>Who is playing?</p><div class="wr" id="wt"></div><p>How much do you bet?</p><div class="wr" id="wa"></div><button class="big" id="wk">Lock it in 🔒</button></div>';document.body.appendChild(w);
 let ti=0,so=500;const tb=[],ab=[],opts=[100,300,500,1000,'ALL IN'];const pick=o=>o==='ALL IN'?Math.max(base,teams[ti].s):o;
 teams.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.n;b.onclick=()=>{ti=i;tb.forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};tb.push(b);w.querySelector('#wt').appendChild(b)});
 opts.forEach(o=>{const b=document.createElement('button');b.textContent=o==='ALL IN'?'ALL IN 🔥':'$'+o;b.onclick=()=>{so=o;ab.forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};ab.push(b);w.querySelector('#wa').appendChild(b)});
 tb[0].classList.add('sel');ab[2].classList.add('sel');
 w.querySelector('#wk').onclick=()=>{const v=pick(so);w.remove();go(v,ti)}}
function chips(m,tile,val,only,stl,wb){const a=m.querySelector('#area');a.innerHTML='<div class="award"></div><button class="skip">Nobody got it 😬</button>';
 teams.forEach((t,i)=>{if(only!=null&&only!==i)return;const c=document.createElement('div');c.className='chip';c.innerHTML='<span></span><button class="ok">✓</button><button class="no">✗</button>';c.firstChild.textContent=t.n;
  c.querySelector('.ok').onclick=()=>{t.s+=val;t.ok=(t.ok||0)+1;let msg=t.n;if(stl){const o=teams.filter(x=>x!==t);if(o.length){const L=o.reduce((p,q)=>q.s>p.s?q:p);if(L.s>t.s-val){L.s-=val;msg=t.n+' robbed '+L.n+' 🥷'}}}score(i);confetti(180);jingle([659,784,1047,1319,1568]);cel(true,msg,val);finish(m,tile)};
  c.querySelector('.no').onclick=()=>{t.s-=val;t.no=(t.no||0)+1;c.classList.add('off');score(i);sad();cel(false,t.n,val);setTimeout(()=>wheelUI(null,t.n),1600);const cd=m.querySelector('#card');cd.classList.add('shake');setTimeout(()=>cd.classList.remove('shake'),500);if(only!=null)setTimeout(()=>finish(m,tile),900)};
  a.firstChild.appendChild(c)});
 a.querySelector('.skip').onclick=()=>{sad();cel(false,'Nobody got it!',0);finish(m,tile)};}
function show(ci,r,tile,val,only,stl){const m=document.createElement('div');m.id='modal';const q=s=>m.querySelector(s);
 m.innerHTML='<div id="card"><div id="cat"></div><div id="val"></div><div class="tr"><div id="bar"><i></i></div><b id="tm">30</b></div><div id="clue" dir="auto"></div><div id="ans" class="hide" dir="auto"></div><div id="area"><button id="rev">Reveal Answer 👀</button></div></div>';
 document.body.appendChild(m);const k=CATS[ci].c[r],src=k[2]?img(k[2]):null;
 q('#cat').textContent=sub(CATS[ci].n);q('#val').textContent='$'+val+(only!=null?' · '+teams[only].n+' 🔒':'')+(stl?' · 🥷 STEAL':'');sub(k[0]).split('\n').forEach(l=>{const d=document.createElement('div');d.dir='auto';d.textContent=l;if(!/[A-Za-z\u0600-\u06FF]/.test(l))d.className='em'+([...l].length<=6?' big':'');q('#clue').appendChild(d)});
 if(!src&&DEC[ci]){const im=new Image();im.src=DEC[ci];im.className='mcut';q('#card').prepend(im)}
 if(src){const im=new Image();im.id='cimg';im.src=src;q('#clue').before(im);if(!CATS[ci].flag){im.style.filter='blur(26px)';im.getBoundingClientRect();im.style.transition='filter 30s linear';im.style.filter='blur(3px)'}}
 let sec=30,done=false;const tm=q('#tm'),rev=q('#rev');
 const iv=setInterval(()=>{if(!document.body.contains(m)){clearInterval(iv);return}sec--;tm.textContent=sec;if(sec<=5){tm.classList.add('low');if(sec>0)beep(880,.08,'square',.07)}if(sec<=0&&!done){sad();cel(false,"TIME'S UP! ⏰",0);rev.click()}},1000);
 rev.onclick=()=>{if(done)return;done=true;clearInterval(iv);q('#bar').classList.add('hide');tm.classList.add('hide');const an=q('#ans');an.classList.remove('hide');const im=q('#cimg');if(im){im.style.transition='filter .6s';im.style.filter='none'}
  {an.textContent=sub(k[1]);if(k[3])try{new Audio(k[3]).play()}catch(e){}jingle([523,659]);chips(m,tile,val,only,stl,true)}}}
function wheelUI(info,who){const m=document.createElement('div');m.id='modal';const cols=['#ff4fa3','#9b2fd1','#ffd166','#6ee7ff'];
 m.innerHTML='<div id="card"><div id="cat">🎡 Dare Wheel</div><div class="wh"><i class="wp"></i><div class="wl"></div></div><div id="ans" class="hide"></div><div id="area"><button class="sp">SPIN! 🎡</button></div></div>';
 const wl=m.querySelector('.wl');wl.style.background='conic-gradient('+DARES.map((d,i)=>cols[i%4]+' '+i*45+'deg '+(i+1)*45+'deg').join(',')+')';
 DARES.forEach((d,i)=>{const b=document.createElement('b');b.textContent=d[0];b.style.transform='rotate('+(i*45+22.5)+'deg)';wl.appendChild(b)});
 document.body.appendChild(m);if(who)m.querySelector('#cat').textContent='🎡 '+who+', spin your dare!';let spun=false;
 m.querySelector('.sp').onclick=()=>{if(spun)return;spun=true;const R=360*6+Math.floor(Math.random()*360);wl.style.transform='rotate('+R+'deg)';for(let i=0,t=0;t<4200;i++){setTimeout(()=>beep(650+(i%2)*120,.04,'square',.05),t);t+=55+i*7}
  setTimeout(()=>{const d=DARES[Math.floor(((360-R%360)%360)/45)],an=m.querySelector('#ans');an.classList.remove('hide');an.textContent=d[0]+' '+d[1];jingle([523,659,784,1047]);confetti(80);
   if(info){chips(m,info.tile,info.val,null,false,false)}else{m.querySelector('#area').innerHTML='<button class="done">Done! ✅</button>';m.querySelector('.done').onclick=()=>m.remove()}},4500)}}
const HAPPY=['SLAY! 💅','YASSS QUEEN! 👑','BIG BRAIN BRIDESMAID! 🧠','HOT DAMN! 🔥','ICONIC! ✨','NAILED IT! 💍','TAKE A SIP! 🥂'];const SAD=['WAMP WAMP 📉','OOF… 😬','AWKWARD… 🦗','NOT EVEN CLOSE 💀','THE BRIDE IS DISAPPOINTED 😔','SIP OF SHAME 🍷','YIKES 🫣'];function sad(){let t=0;[[392,.35],[370,.35],[349,.35],[311,1]].forEach(([f,d])=>{setTimeout(()=>beep(f,d,'sawtooth',.1),t);t+=d*900})}function cel(good,team,val){const o=document.createElement('div');o.id='cel';o.className=good?'cg':'cb';const arr=good?HAPPY:SAD;o.innerHTML='<div class="ct"></div><div class="cs"></div>';o.firstChild.textContent=arr[Math.floor(Math.random()*arr.length)];o.lastChild.textContent=val?((good?'+':'−')+'$'+val+' · '+team):team;const em=good?['💃','🥳','🎉','👯‍♀️','🍾','💖','🪩']:['😭','💧','😢','🥀','⛈️','💔'];for(let i=0;i<24;i++){const e=document.createElement('span');e.className='ce';e.textContent=em[i%em.length];e.style.left=Math.random()*100+'%';e.style.fontSize=24+Math.random()*34+'px';e.style.animationDelay=Math.random()*.8+'s';e.style.animationDuration=(good?1.8:2.2)+Math.random()+'s';o.appendChild(e)}document.body.appendChild(o);setTimeout(()=>o.remove(),2700)}function finish(m,tile){m.remove();tile.classList.add("used");if(++used>=CATS.length*5)setTimeout(end,700)}
function end(){const rank=[...teams].sort((a,b)=>b.s-a.s),top=rank[0],best=[...teams].sort((a,b)=>(b.ok||0)-(a.ok||0))[0],oops=[...teams].sort((a,b)=>(b.no||0)-(a.no||0))[0];const w=document.createElement('div');w.id='win';
 w.innerHTML='<div class="cg rain"></div><img class="wphoto" src="'+FOUFI+'" style="object-position:50% 15%"><div class="cert"><div class="c1">🏆 BRIDESMAID OF THE YEAR 🏆</div><div class="c2"></div><div class="c3"></div></div><div class="rec"></div><button id="again">Play Again 🔁</button>';
 w.querySelector('.c2').textContent=top.n;w.querySelector('.c3').textContent='$'+top.s.toLocaleString()+' · Crowned by the bride 💖';
 const rec=w.querySelector('.rec');rank.forEach((t,i)=>{const d=document.createElement('div');d.textContent=['🥇','🥈','🥉','🎗️'][i]+' '+t.n+' — $'+t.s.toLocaleString()+' · ✓'+(t.ok||0)+' ✗'+(t.no||0);rec.appendChild(d)});
 const x=document.createElement('div');x.className='aw';x.textContent='🧠 Big Brain: '+best.n+'  ·  😬 Most oopsies: '+oops.n;rec.appendChild(x);
 const em=['🏆','🥂','👑','💖','🎉','🍾'],rn=w.querySelector('.rain');for(let i=0;i<30;i++){const e=document.createElement('span');e.className='ce';e.textContent=em[i%6];e.style.left=Math.random()*100+'%';e.style.fontSize=22+Math.random()*26+'px';e.style.animationDelay=Math.random()*3+'s';e.style.animationDuration=2+Math.random()*2+'s';e.style.animationIterationCount='infinite';rn.appendChild(e)}
 document.body.appendChild(w);$("#again").onclick=()=>location.reload();jingle([523,659,784,1047,784,1047,1319]);confetti(200);setTimeout(()=>confetti(200),600);setTimeout(()=>confetti(200),1200)}
</script>
